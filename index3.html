<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XML Documents - Srushti Aralekar</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            padding: 40px;
            text-align: center;
        }

        /* Heading Styling */
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 36px;
        }

        /* Info Text (for Roll No, Batch) */
        .info {
            margin-bottom: 30px;
            font-size: 20px;
            color: #555;
        }

        /* Button Container */
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        /* Buttons */
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Button Hover Effect */
        .btn:hover {
            background-color: #388E3C;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            font-size: 16px;
            color: #333;
        }

        /* Resume Specific Styling (if used) */
        .resume-box {
            background: white;
            padding: 30px;
            margin: auto;
            width: 70%;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: left;
        }

        .resume-box img {
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 3px solid #4CAF50;
        }

        .resume-box h2 {
            margin-top: 20px;
            color: #333;
        }

        .resume-box ul {
            padding-left: 20px;
        }

        hr {
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <h1>Srushti Aralekar</h1>
    <div class="info">Roll Number: 136 | Batch: S6</div>

    <div class="button-container">
        <a href="document1.xml" class="btn">XML Document 1</a>
        <a href="document2.xml" class="btn">XML Document 2</a>
        <a href="document3.xml" class="btn">XML Document 3</a>
        <a href="document4.xml" class="btn">XML Document 4</a>
    </div>

    <footer>
        <p>Click on a document to view it.</p>
    </footer>

</body>
</html>
