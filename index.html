<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page - Srushti Aralekar</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #c3ecb2, #7ee8fa);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        /* Heading Styling */
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 42px;
            letter-spacing: 1px;
        }

        /* Info Text */
        .info {
            margin-bottom: 40px;
            font-size: 20px;
            color: #555;
        }

        /* Button Container */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 18px 35px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, background 0.3s;
        }

        /* Button Hover Effect */
        .btn:hover {
            background: linear-gradient(135deg, #66BB6A, #388E3C);
            transform: translateY(-5px) scale(1.05);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Srushti Aralekar</h1>
    <div class="info">Roll Number: 136 | Batch: S6</div>

    <div class="button-container">
        <a href="html/index.html" class="btn">HTML Assignments</a>
        <a href="css/index.html" class="btn">CSS Codes</a>
        <a href="xml/index.html" class="btn">XML Documents</a>
    </div>

    <footer>
        <p>Click on a button to view the respective folder contents.</p>
    </footer>

</body>
</html>
