<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Codes - Srushti Aralekar</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, #f4f7f8, #ddeeff);
        }

        fieldset {
            width: 70%;
            margin: 30px auto;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 30px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        img {
            display: block;
            margin: 0 auto 20px;
            border: 3px solid #444;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin: 10px 0;
        }

        p, li {
            font-size: 16px;
            color: #333;
        }

        hr {
            border: 0;
            border-top: 2px solid #bbb;
            margin: 25px 0;
        }

        section {
            margin: 20px 0;
        }

        ul {
            list-style: square;
            padding-left: 25px;
        }

        /* Additional Styling for this page */
        .info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #555;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 16px;
            color: #333;
        }
    </style>

</head>
<body>

    <h1>Srushti Aralekar</h1>
    <div class="info">Roll Number: 136 | Batch: S6</div>

        <a href="code3.html" class="btn">CSS Code 3</a>

        <a href="code5.html" class="btn">CSS Code 5</a>
        <a href="code6.html" class="btn">CSS Code 6</a>
    </div>

    <footer>
        <p>Click on a code file to view it.</p>
    </footer>

</body>
</html>
